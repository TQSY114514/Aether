<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="purple-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="green-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="orange-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="cyan-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="680" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Title -->
  <text x="24" y="36" fill="#111827" font-size="18" font-weight="700">AetherAI</text>
  <text x="110" y="36" fill="#6b7280" font-size="13" font-weight="400">Architecture Overview</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- TOP: Provider Layer                     -->
  <!-- ═══════════════════════════════════════ -->
  <text x="480" y="72" fill="#9ca3af" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">PROVIDER LAYER</text>

  <!-- OpenAI -->
  <rect x="60" y="82" width="160" height="40" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="107" fill="#1d4ed8" font-size="12" font-weight="600" text-anchor="middle">OpenAI Compatible</text>

  <!-- Anthropic -->
  <rect x="250" y="82" width="160" height="40" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="330" y="107" fill="#6d28d9" font-size="12" font-weight="600" text-anchor="middle">Anthropic API</text>

  <!-- Local -->
  <rect x="440" y="82" width="160" height="40" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="520" y="107" fill="#047857" font-size="12" font-weight="600" text-anchor="middle">Local Models</text>

  <!-- Any Endpoint -->
  <rect x="630" y="82" width="160" height="40" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="710" y="107" fill="#b45309" font-size="12" font-weight="600" text-anchor="middle">Any REST Endpoint</text>

  <!-- Provider examples -->
  <text x="480" y="150" fill="#9ca3af" font-size="9" text-anchor="middle">
    OpenRouter · Together · DeepSeek · Ollama · LM Studio · custom ...
  </text>

  <!-- Arrows down -->
  <line x1="140" y1="122" x2="140" y2="195" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="330" y1="122" x2="330" y2="195" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="520" y1="122" x2="520" y2="195" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="710" y1="122" x2="710" y2="195" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ═══════════════════════════════════════ -->
  <!-- MIDDLE: Main Process (Electron)          -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Main container -->
  <rect x="20" y="195" width="920" height="300" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>

  <text x="36" y="222" fill="#6b7280" font-size="10" font-weight="700" letter-spacing="1.5">ELECTRON MAIN PROCESS</text>

  <!-- LLM Adapter -->
  <text x="36" y="248" fill="#6b7280" font-size="9" font-weight="700" letter-spacing="0.5">LLM ADAPTER</text>
  <rect x="36" y="255" width="280" height="115" rx="6" fill="url(#purple-bg)" stroke="#c4b5fd" stroke-width="1"/>

  <text x="50" y="277" fill="#6d28d9" font-size="11" font-weight="700">providerAdapter.js</text>
  <text x="50" y="296" fill="#6b7280" font-size="9">├── streamChat / completeChat</text>
  <text x="50" y="312" fill="#6b7280" font-size="9">├── provider routing (openai/anthropic)</text>
  <text x="50" y="328" fill="#6b7280" font-size="9">├── credentialPool (key rotation)</text>
  <text x="50" y="344" fill="#6b7280" font-size="9">├── providerHealth (success rate)</text>
  <text x="50" y="360" fill="#6b7280" font-size="9">├── modelAdvisor / modelRouter</text>
  <text x="50" y="376" fill="#6b7280" font-size="9">└── reasoning / toolCallRepair</text>

  <!-- Agent Tool Loop -->
  <text x="350" y="248" fill="#6b7280" font-size="9" font-weight="700" letter-spacing="0.5">AGENT TOOL LOOP</text>
  <rect x="350" y="255" width="280" height="115" rx="6" fill="url(#green-bg)" stroke="#6ee7b7" stroke-width="1"/>

  <text x="364" y="277" fill="#047857" font-size="11" font-weight="700">toolLoop.js</text>
  <text x="364" y="296" fill="#6b7280" font-size="9">├── Plan → Act → Observe</text>
  <text x="364" y="312" fill="#6b7280" font-size="9">├── 16 tools (read/write/search/git/shell/...)</text>
  <text x="364" y="328" fill="#6b7280" font-size="9">├── sandbox (3-layer defense)</text>
  <text x="364" y="344" fill="#6b7280" font-size="9">├── permission ladder (Off / Plan / Ask / Auto / Yolo)</text>
  <text x="364" y="360" fill="#6b7280" font-size="9">├── iteration budget (default 25)</text>
  <text x="364" y="376" fill="#6b7280" font-size="9">└── hooks (10 lifecycle points)</text>

  <!-- Supporting Systems -->
  <text x="670" y="248" fill="#6b7280" font-size="9" font-weight="700" letter-spacing="0.5">SUPPORTING SYSTEMS</text>
  <rect x="670" y="255" width="270" height="115" rx="6" fill="url(#orange-bg)" stroke="#fcd34d" stroke-width="1"/>

  <text x="684" y="277" fill="#b45309" font-size="11" font-weight="700">supporting modules</text>
  <text x="684" y="296" fill="#6b7280" font-size="9">├── autoMemory (long-term structured)</text>
  <text x="684" y="312" fill="#6b7280" font-size="9">├── compaction (context, pair-preserving)</text>
  <text x="684" y="328" fill="#6b7280" font-size="9">├── skills / slash commands (/code, /explain)</text>
  <text x="684" y="344" fill="#6b7280" font-size="9">├── MCP manager (stdio JSON-RPC 2.0)</text>
  <text x="684" y="360" fill="#6b7280" font-size="9">├── habitLearner / errorClassify</text>
  <text x="684" y="376" fill="#6b7280" font-size="9">└── auditLog / checkpoints</text>

  <!-- ═══════════════════════════════════════ -->
  <!-- BOTTOM: Renderer Process (React)         -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="20" y="505" width="920" height="140" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>

  <text x="36" y="530" fill="#6b7280" font-size="10" font-weight="700" letter-spacing="1.5">RENDERER PROCESS — REACT + TYPESCRIPT</text>

  <!-- State Management -->
  <rect x="36" y="538" width="160" height="55" rx="6" fill="url(#cyan-bg)" stroke="#67e8f9" stroke-width="1"/>
  <text x="116" y="558" fill="#0e7490" font-size="11" font-weight="700" text-anchor="middle">zustand</text>
  <text x="116" y="576" fill="#6b7280" font-size="9" text-anchor="middle">Global State · ~1,000 lines</text>

  <!-- Pages -->
  <rect x="210" y="538" width="320" height="55" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="224" y="558" fill="#374151" font-size="9" font-weight="700">PAGES</text>
  <text x="224" y="576" fill="#6b7280" font-size="9">
    ChatPage · ModelPage · PersonaPage · SettingPage · ScoresPage · MemoryPage · SkillsPage · LearningGraphPage
  </text>

  <!-- Components -->
  <rect x="544" y="538" width="250" height="55" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="558" y="558" fill="#374151" font-size="9" font-weight="700">COMPONENTS</text>
  <text x="558" y="576" fill="#6b7280" font-size="9">
    ToolCallBlock · ChatWindow · ThinkingBlock · AgentPlanTrace · PermissionDialog · ...
  </text>

  <!-- Bottom row of renderer -->
  <rect x="810" y="538" width="120" height="55" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="824" y="558" fill="#374151" font-size="9" font-weight="700">SHARED</text>
  <text x="824" y="576" fill="#6b7280" font-size="9">
    i18n · Theme · Markdown · Types
  </text>

  <!-- Footer tech stack bar -->
  <line x1="20" y1="652" x2="940" y2="652" stroke="#e5e7eb" stroke-width="1"/>
  <text x="480" y="670" fill="#9ca3af" font-size="9" text-anchor="middle" letter-spacing="0.5">
    Electron 31  ·  React 18  ·  TypeScript 5.5  ·  Zustand 4.5  ·  Vite 5.4  ·  sql.js  ·  Tailwind CSS 3.4
  </text>

  <!-- ═══════════════════════════════════════ -->
  <!-- RIGHT: Database (shared)                -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="900" y="200" width="40" height="350" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="920" y="218" fill="#7c3aed" font-size="8" font-weight="800" text-anchor="middle" letter-spacing="0.5">DB</text>
  <text x="920" y="230" fill="#9ca3af" font-size="6" text-anchor="middle">sql.js</text>
  <line x1="912" y1="238" x2="928" y2="238" stroke="#e5e7eb" stroke-width="0.5"/>
  <text x="920" y="248" fill="#6b7280" font-size="5.5" text-anchor="middle">sessions</text>
  <text x="920" y="258" fill="#6b7280" font-size="5.5" text-anchor="middle">messages</text>
  <text x="920" y="268" fill="#6b7280" font-size="5.5" text-anchor="middle">providers</text>
  <text x="920" y="278" fill="#6b7280" font-size="5.5" text-anchor="middle">models</text>
  <text x="920" y="288" fill="#6b7280" font-size="5.5" text-anchor="middle">personas</text>
  <text x="920" y="298" fill="#6b7280" font-size="5.5" text-anchor="middle">memory</text>
  <text x="920" y="308" fill="#6b7280" font-size="5.5" text-anchor="middle">settings</text>
  <text x="920" y="318" fill="#6b7280" font-size="5.5" text-anchor="middle">mcp</text>
  <text x="920" y="328" fill="#6b7280" font-size="5.5" text-anchor="middle">arena</text>
  <text x="920" y="338" fill="#6b7280" font-size="5.5" text-anchor="middle">usage</text>
  <text x="920" y="348" fill="#6b7280" font-size="5.5" text-anchor="middle">config</text>
  <text x="920" y="358" fill="#6b7280" font-size="5.5" text-anchor="middle">audit</text>
  <text x="920" y="368" fill="#6b7280" font-size="5.5" text-anchor="middle">skills</text>
  <text x="920" y="378" fill="#9ca3af" font-size="5.5" text-anchor="middle">+ 6</text>

  <!-- Connection DB → main process -->
  <line x1="900" y1="375" x2="760" y2="375" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
</svg>
