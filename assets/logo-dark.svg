<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="dGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glowDark">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- 深色背景（带圆角，适合应用图标） -->
  <rect width="256" height="256" fill="#0a0a0f" rx="32"/>

  <!-- 主菱形（更亮） -->
  <polygon points="128,32 208,128 128,224 48,128" fill="none" stroke="url(#dGrad)" stroke-width="3.5"/>
  <!-- 内层菱形 -->
  <polygon points="128,56 182,128 128,200 74,128" fill="none" stroke="url(#dGradLight)" stroke-width="1.5" opacity="0.6"/>

  <!-- A 斜线 -->
  <line x1="98" y1="170" x2="128" y2="72" stroke="url(#dGradLight)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="158" y1="170" x2="128" y2="72" stroke="url(#dGradLight)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 中心节点（更亮） -->
  <circle cx="128" cy="132" r="7" fill="#ffffff" filter="url(#glowDark)"/>

  <!-- 子节点 -->
  <circle cx="74" cy="180" r="3.5" fill="#a78bfa" opacity="0.8"/>
  <circle cx="182" cy="180" r="3.5" fill="#67e8f9" opacity="0.8"/>
  <line x1="74" y1="180" x2="128" y2="132" stroke="#818cf8" stroke-width="1.2" opacity="0.5"/>
  <line x1="182" y1="180" x2="128" y2="132" stroke="#818cf8" stroke-width="1.2" opacity="0.5"/>
</svg>
