# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit 配置 — Aether
# 目标：聚焦高价值架构审查，屏蔽文档与锁文件噪音，遵守 Aether 架构红线
# 字段规范参考: https://docs.coderabbit.ai/reference/configuration

language: "zh-CN"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "master"
      - "main"

  path_filters:
    - "!**/CHANGELOG.md"
    - "!**/README*.md"
    - "!**/docs/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/yarn.lock"
    - "!**/evals/**"

  path_instructions:
    - path: "app/electron/**"
      instructions: |
        Electron 主进程，必须 CommonJS（require/module.exports），禁 ES import。
        保持 IPC 三文件契约（ipc/*.handler.js + preload.js + src/env.d.ts）同步。
        database 用 better-sqlite3 WAL，参数化查询 prepare().get/all/run。
    - path: "app/src/**"
      instructions: |
        React 18 + TS + Zustand + Tailwind。遵循 docs/ui-design.md，
        禁用紫/靛渐变背景、bg-clip-text 渐变标题、emoji 图标（用 Lucide）。
    - path: "app/tui/**"
      instructions: |
        React + Ink v5 终端界面，严格禁止 Electron 依赖。

chat:
  auto_reply: true
