# 路径 → PR 标签映射（与 scripts/ci/classify_changes.mjs 的 lane 规则对齐）

core:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/electron/**/*'
          - 'app/scripts/**/*'

renderer:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/**/*'

tui:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/tui/**/*'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/test/**/*'
          - 'evals/**/*'
          - 'app/**/*.test.*'
          - 'app/**/*.spec.*'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/package.json'
          - 'app/package-lock.json'
          - 'app/tui/package.json'
          - 'app/tui/package-lock.json'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**/*'
          - '**/*.md'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'
          - 'scripts/**/*'