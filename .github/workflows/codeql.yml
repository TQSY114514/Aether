name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:      # 允许手动触发
  schedule:
    - cron: '0 6 * * 1'   # 每周一 06:00 UTC 定期扫描

permissions:
  contents: read
  security-events: write   # 上传 CodeQL 结果需要

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          # 分析应用代码（JS/TS）与 GitHub Actions 工作流（防止表达式注入与 CI 供应链风险）
          languages: javascript-typescript, actions

      - uses: github/codeql-action/analyze@v3
