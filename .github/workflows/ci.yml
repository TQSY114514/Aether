permissions:
  contents: read

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Build renderer
        working-directory: app
        run: npm run build

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Verify main-process modules parse
        working-directory: app
        run: |
          node --check electron/database.js
          node --check electron/ipc/chat.handler.js
          node --check electron/ipc/config.handler.js
          node --check electron/ipc/provider.handler.js
          node --check electron/ipc/model.handler.js
          node --check electron/ipc/memory.handler.js
          node --check electron/ipc/skills.handler.js
          node --check electron/llm/toolLoop.js
          node --check electron/llm/localGateway.js
          node --check electron/tools/registry.js
          node --check electron/preload.js
