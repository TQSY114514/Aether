name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # --ignore-scripts skips postinstall (electron-rebuild) —
        # CI only needs to typecheck and build the renderer, not compile native modules.
        run: cd app && npm ci --ignore-scripts

      - name: IPC contract check
        run: cd app && node scripts/check-ipc.js

      - name: Build
        run: cd app && npm run build