name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd app && npm ci --ignore-scripts

      - name: IPC contract check
        run: cd app && node scripts/check-ipc.js

      - name: TypeScript check
        run: cd app && npx tsc --noEmit

      - name: Run tests
        run: cd app && npm test

      - name: Build renderer
        run: cd app && npx vite build
