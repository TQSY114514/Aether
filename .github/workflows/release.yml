# Builds Windows portable + NSIS installer on tag push and publishes to the
# GitHub Release. Runs on windows-2022 to ensure node-gyp compatibility for
# better-sqlite3 native compilation.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required for electron-builder to create/upload the Release

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # Sync package.json version with the git tag (strip leading 'v').
      # Without this, electron-builder uses the package.json version and may
      # collide with an existing Release (e.g. tag v0.5.16 but version still
      # 0.5.15 → "existing release published more than 2 hours ago" skip).
      - name: Sync package.json version with tag
        working-directory: app
        run: |
          $TAG = $env:GITHUB_REF -replace 'refs/tags/v', ''
          echo "Syncing package.json version to $TAG"
          node -e "const fs=require('fs');const p=require('./package.json');p.version='$TAG';fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"
          echo "version=$TAG" >> $env:GITHUB_ENV

      - name: Build renderer (Vite)
        working-directory: app
        run: npm run build

      - name: Build Windows artifacts (no auto-publish to avoid duplicate Release creation)
        working-directory: app
        # Targets + order come from electron-builder.yml (portable then nsis —
        # nsis must build last so latest.yml points at the setup exe).
        run: npx electron-builder --win --x64 --publish never

      # Guard against a silent regression of the <=0.7.2 bug (one target's
      # artifact overwriting the other, latest.yml pointing at the portable
      # exe): fail the release BEFORE publishing if artifacts look wrong.
      - name: Verify build artifacts (setup + portable + latest.yml)
        working-directory: app/release
        run: |
          $setup = Get-ChildItem -Filter 'aetherai-setup-*.exe' -ErrorAction SilentlyContinue
          $portable = Get-ChildItem -Filter 'aetherai-*.exe' | Where-Object { $_.Name -notmatch '-setup-' }
          if (-not $setup) { throw 'NSIS setup exe missing from build output' }
          if (-not $portable) { throw 'portable exe missing from build output' }
          $yml = Get-Content latest.yml -Raw
          if ($yml -notmatch 'aetherai-setup-[\d.]+\.exe') { throw "latest.yml does not reference the NSIS setup exe (electron-updater would download the portable exe):`n$yml" }
          echo 'Artifacts OK:'; Get-ChildItem -Filter *.exe | Select-Object -ExpandProperty Name

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/release/*.exe
            app/release/latest*.yml
            app/release/*.blockmap
          generate_release_notes: true

      # Safety net: upload artifacts even if publish fails.
      - name: Upload artifacts (safety net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetherai-win-artifacts
          path: |
            app/release/*.exe
            app/release/latest*.yml
            app/release/*.blockmap
          if-no-files-found: warn