name: Dependency Vulnerability Scan (OSV)

# hermes-agent 同款：google/osv-scanner 免费扫描 lockfile，
# 结果上传 SARIF（GitHub Security 标签可看），漏洞命中即失败。
on:
  push:
    branches: [master, main]
    paths:
      - 'app/package-lock.json'
      - 'app/tui/package-lock.json'
      - 'app/package.json'
      - 'app/tui/package.json'
  pull_request:
    branches: [master, main]
    paths:
      - 'app/package-lock.json'
      - 'app/tui/package-lock.json'
      - 'app/package.json'
      - 'app/tui/package.json'

permissions:
  contents: read
  security-events: write

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OSV-Scanner
        run: |
          curl -fsSL https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64 -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner

      - name: Run OSV Scanner
        run: |
          osv-scanner \
            --format=sarif \
            --output=osv-results.sarif \
            --lockfile=app/package-lock.json \
            --lockfile=app/tui/package-lock.json || true

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: osv-results.sarif