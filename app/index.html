<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- H2 (2026-08 audit): renderer CSP. Scripts/styles/assets are same-origin
       only; images may additionally be data:/https: (markdown & attachments);
       network egress from the renderer is restricted to loopback services
       (dev server HMR, local gateway). Remote fonts were removed with this. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:*; font-src 'self' data:" />
  <title>AetherAI</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
