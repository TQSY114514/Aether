appId: com.aetherai.app
productName: AetherAI
copyright: Copyright © 2026
directories:
  output: release
  buildResources: resources
files:
  - electron/**/*
  - dist/**/*
  - package.json
asar: true

# Publish provider: electron-updater reads latest.yml from the latest GitHub
# Release asset list. owner/repo are also auto-detected from git remote, but set
# explicitly to be safe. token is NEVER put here — it comes from GH_TOKEN in CI.
publish:
  provider: github
  owner: TQSY114514
  repo: AetherAI
  releaseType: release
  vPrefixedTagName: true

win:
  target:
    - nsis
    - portable
  icon: resources/icon.png
  darkModeSupport: true
  artifactName: ${name}-${version}-${os}-${arch}.${ext}

linux:
  icon: resources

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
