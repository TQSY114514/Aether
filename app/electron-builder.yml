appId: com.aetherai.app
productName: Aether
copyright: Copyright © 2026
directories:
  output: release
  buildResources: resources
# Skip native-module rebuild: better-sqlite3 in node_modules is already
# compiled for Electron 43 (dev mode uses it directly), and rebuild would
# require VS Build Tools (node-gyp) which dev machines may not have.
npmRebuild: false
# buildResources (resources/) is auto-excluded from asar — copy it outside
# the app bundle so runtime paths like ../resources/icon.ico resolve on disk.
extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"
  # Licence/notice files are also listed under `files` (inside app.asar). These copies
  # land next to the archive as plain readable files, so desktop users can actually
  # find the attribution without unpacking the asar.
  - from: LICENSE
    to: LICENSE
  - from: NOTICE
    to: NOTICE
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
files:
  - electron/**/*
  - dist/**/*
  - package.json
  - LICENSE
  - NOTICE
  - THIRD-PARTY-NOTICES.md
asar: true

# Publish provider: electron-updater reads latest.yml from the latest GitHub
# Release asset list. owner/repo are also auto-detected from git remote, but set
# explicitly to be safe. token is NEVER put here — it comes from GH_TOKEN in CI.
# CN mirror: electron-builder downloads the Electron dist zip from GitHub
# releases, which is flaky from mainland networks (ECONNRESET on 44.3.0).
# npmmirror hosts both the Electron dist and electron-builder binaries;
# electronDownload.mirror covers the Electron zip, .npmrc covers the rest.
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

publish:
  provider: github
  owner: TQSY114514
  repo: Aether
  releaseType: release
  vPrefixedTagName: true

win:
  # portable builds first, nsis last: with multiple win targets both write
  # release/latest.yml (last one wins), and it must point at the NSIS
  # installer so electron-updater downloads the setup exe (the portable exe
  # cannot self-install an update). Keep this order if targets change.
  target:
    - portable
    - nsis
  icon: resources/icon.ico

linux:
  icon: resources

# Per-target artifact names — REQUIRED. A single win.artifactName gives both
# targets the same filename and the second build silently overwrites the
# first (this is why releases <= 0.7.2 shipped only one exe: the NSIS
# installer was overwritten by the portable build). Names match the download
# table documented in README.md.
portable:
  artifactName: ${name}-${version}.${ext}

nsis:
  artifactName: ${name}-setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
